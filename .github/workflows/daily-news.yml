name: 매일 경제 뉴스 업데이트

# 한국시간 매일 06:00 자동 실행
on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = KST 06:00
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # index.html 자동 커밋을 위해 필수

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: pip install -r requirements.txt

      - name: 뉴스 HTML 생성
        run: python news.py

      - name: 변경사항 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update news $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
